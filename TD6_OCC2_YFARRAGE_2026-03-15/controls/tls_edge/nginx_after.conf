server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name td4.local;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # HARDENED — profil TLS aligné NIST SP 800-52 Rev.2
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!MD5:!RC4:!DH";
    ssl_prefer_server_ciphers on;

    # HSTS — max-age court pour le lab (300s = 5 minutes)
    add_header Strict-Transport-Security "max-age=300" always;
    
    # Block SQLi patterns
    if ($request_uri ~* "(select|union|insert|drop|'|--|;)") {
        return 403;
    }

    # Block bad User-Agents
    if ($http_user_agent ~* "(sqlmap|nikto|nmap|masscan|havij)") {
        return 403;
    }

    # Block non-standard HTTP methods
    if ($request_method !~ ^(GET|POST|HEAD)$) {
        return 405;
    }

    location / {
        root /var/www/html;
        index index.html;
    }

    location /api {
        limit_req zone=api_limit burst=2 nodelay;
        root /var/www/html;
        index index.html;
    }
}
